services:
  db:
    image: postgis/postgis:16-3.4
    container_name: workdeal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workdeal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workdeal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
